# 使用Redis Sentinel模式，一主两从
# docker compose -f redis-sentinel-cluster.yaml -p redis-sentinel-cluster up -d
services:
  redis-master:
    image: redis:7.2
    container_name: redis-master
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - /srv/redis-sentinel-cluster/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-master-data:/data
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    cpus: 2
    mem_limit: 2g
    networks:
      - redis-net

  redis-replica-1:
    image: redis:7.2
    container_name: redis-replica-1
    command:
      [
        "redis-server",
        "/usr/local/etc/redis/redis.conf",
        "--replicaof",
        "redis-master",
        "6379"
      ]
    volumes:
      - /srv/redis-sentinel-cluster/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-replica-1-data:/data
    ports:
      - "6380:6379"
    depends_on:
      - redis-master
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    cpus: 2
    mem_limit: 2g
    networks:
      - redis-net

  redis-replica-2:
    image: redis:7.2
    container_name: redis-replica-2
    command:
      [
        "redis-server",
        "/usr/local/etc/redis/redis.conf",
        "--replicaof",
        "redis-master",
        "6379"
      ]
    volumes:
      - /srv/redis-sentinel-cluster/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-replica-2-data:/data
    ports:
      - "6381:6379"
    depends_on:
      - redis-master
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    cpus: 2
    mem_limit: 2g
    networks:
      - redis-net

  sentinel-1:
    image: redis:7.2
    container_name: sentinel-1
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    volumes:
      - /srv/redis-sentinel-cluster/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    ports:
      - "26379:26379"
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      - redis-net

  sentinel-2:
    image: redis:7.2
    container_name: sentinel-2
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    volumes:
      - /srv/redis-sentinel-cluster/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    ports:
      - "26380:26379"
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      - redis-net

  sentinel-3:
    image: redis:7.2
    container_name: sentinel-3
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    volumes:
      - /srv/redis-sentinel-cluster/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    ports:
      - "26381:26379"
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      - redis-net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      - redis-net

volumes:
  redis-master-data:
  redis-replica-1-data:
  redis-replica-2-data:
  redisinsight-data:

networks:
  redis-net:
    driver: bridge